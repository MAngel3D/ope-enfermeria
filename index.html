<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OPE Enfermería">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F6F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1516" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" type="image/png" href="icono-180.png">
<title>Cuaderno OPE Enfermería</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: columna de lectura (máx. 880px; fichas a ~68 caracteres) con cabecera fija y pestañas; el temario es una lista operable, la ficha es un documento */
:root{
  --bg:#F2F6F5; --surface:#FFFFFF; --sunk:#E6EDEB; --ink:#122A2B; --muted:#56696A; --line:#D2DDDA;
  --accent:#0B6B66; --accent-ink:#FFFFFF; --accent-soft:#DAECE9;
  --omr:#C2306A; --omr-soft:#F9E2EB;
  --ok:#1C7C45; --ok-soft:#DCF0E3; --bad:#B4372B; --bad-soft:#F8E1DC; --warn:#9A6210; --warn-soft:#F6EAD2;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:14px; --fs:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1516; --surface:#132022; --sunk:#0F1A1B; --ink:#E1EBE9; --muted:#93A7A5; --line:#24383A;
  --accent:#4BBDB2; --accent-ink:#04201D; --accent-soft:#163633;
  --omr:#F06A99; --omr-soft:#3B1A28;
  --ok:#52C483; --ok-soft:#11301F; --bad:#F27766; --bad-soft:#3A1914; --warn:#E6AB4C; --warn-soft:#33260F;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C1516; --surface:#132022; --sunk:#0F1A1B; --ink:#E1EBE9; --muted:#93A7A5; --line:#24383A;
  --accent:#4BBDB2; --accent-ink:#04201D; --accent-soft:#163633;
  --omr:#F06A99; --omr-soft:#3B1A28;
  --ok:#52C483; --ok-soft:#11301F; --bad:#F27766; --bad-soft:#3A1914; --warn:#E6AB4C; --warn-soft:#33260F;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--omr);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none;color:var(--ink)}
.brand .dot{width:22px;height:22px;border-radius:5px;border:2.5px solid var(--accent);display:grid;place-items:center;font:600 11px var(--mono);color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:14px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.count{background:var(--omr-soft);color:var(--omr);font-weight:700}
.chip.sync[data-s="sync"]{color:var(--ok);background:var(--ok-soft)}
.chip.sync[data-s="offline"]{color:var(--warn);background:var(--warn-soft)}
nav.tabs{display:flex;gap:4px;padding-bottom:8px;overflow-x:auto}
nav.tabs a{padding:8px 14px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:700;font-size:16px;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
main{padding-block:20px 80px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:30px;font-weight:800;letter-spacing:-.015em}
h2{font-size:22px;font-weight:800}
h3{font-size:18px;font-weight:600}
.muted{color:var(--muted)}.small{font-size:14px}.mono{font-family:var(--mono)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.hero .big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.02em}
.hero .big span{color:var(--omr)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:6px 12px;font-size:15px}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 13px;border-radius:9px;font-weight:700;color:var(--muted);min-height:42px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button[aria-pressed="true"][data-st="1"]{color:var(--warn)}
.seg button[aria-pressed="true"][data-st="2"]{color:var(--accent)}
.seg button[aria-pressed="true"][data-st="3"]{color:var(--ok)}
.code{font:600 13px var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px;display:inline-block;min-width:38px;text-align:center}
.prio{font:600 12px var(--mono);border-radius:6px;padding:2px 6px;white-space:nowrap}
.prio.p1{background:var(--omr);color:#fff}.prio.p2{background:var(--omr-soft);color:var(--omr)}.prio.p3{background:var(--sunk);color:var(--muted)}
.st{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.st.s0{background:var(--sunk);color:var(--muted)}.st.s1{background:var(--warn-soft);color:var(--warn)}.st.s2{background:var(--accent-soft);color:var(--accent)}.st.s3{background:var(--ok-soft);color:var(--ok)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.li:first-child{border-top:0}
.li:hover{background:var(--sunk)}
.li .meta{font-size:14px;color:var(--muted)}
.grp{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:10px 14px;background:var(--sunk);font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:15px;color:var(--muted);min-height:40px}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
input.search{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}
.prog{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center;font-size:15px}
.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar i.b1{background:var(--warn)}.bar i.b2{background:var(--accent)}.bar i.b3{background:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
/* Ficha */
.doc{max-width:68ch;font-size:var(--fs);line-height:1.6}
.doc h3{font-size:1.2em;margin:1.4em 0 .4em;padding-top:.6em;border-top:1px solid var(--line)}
.doc h3:first-child{margin-top:0;border-top:0;padding-top:0}
.doc ul,.doc ol{padding-left:1.25em;margin:.4em 0}
.doc li{margin:.25em 0}
.doc p{margin:.5em 0}
.doc strong{color:var(--ink);background:linear-gradient(transparent 62%,var(--accent-soft) 62%)}
.doc .trap{border-left:4px solid var(--omr);background:var(--omr-soft);border-radius:0 12px 12px 0;padding:10px 14px;margin:.8em 0}
.doc .trap span{display:block;font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--omr);margin-bottom:2px}
.tbl{overflow-x:auto;margin:.7em 0;border:1px solid var(--line);border-radius:12px}
.tbl table{border-collapse:collapse;width:100%;font-size:.92em}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl th{background:var(--sunk);font-size:.85em;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.fichahead{display:flex;flex-direction:column;gap:10px}
.official{font-size:15px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px}
details summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:15px}
textarea.notes{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);resize:vertical;line-height:1.5}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pager{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pager a{display:block;min-width:0;hyphens:auto;overflow-wrap:anywhere;padding:12px 14px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--surface)}
.pager a.r{text-align:right}
/* Plan */
.week{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;padding:14px;border-top:1px solid var(--line)}
.week:first-child{border-top:0}
.week.now{background:var(--accent-soft)}
.week .n{font:600 13px var(--mono);color:var(--muted)}
.week .n b{display:block;font:800 26px var(--display);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips a{font:600 13px var(--mono);padding:4px 8px;border-radius:8px;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:var(--surface)}
.chips a.s1{border-color:var(--warn);color:var(--warn)}.chips a.s2{border-color:var(--accent);color:var(--accent)}.chips a.s3{background:var(--ok);border-color:var(--ok);color:#fff}
/* Examen */
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.facts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.fact .k{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fact .v{font:600 26px var(--mono);font-variant-numeric:tabular-nums;margin-top:2px}
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) 150px 26px;gap:10px;align-items:center;font-size:15px}
@media (min-width:700px){.hb{grid-template-columns:minmax(0,1fr) 280px 26px}}
.hb .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .b{height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.hb .b i{display:block;height:100%;background:var(--omr)}
.hb .v{font:600 14px var(--mono);text-align:right}
table.ev{border-collapse:collapse;width:100%;font-size:15px}
table.ev td,table.ev th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
table.ev td.num{font-family:var(--mono);text-align:right}
.note{font-size:15px;background:var(--warn-soft);border-radius:12px;padding:10px 14px}
.scroll{overflow-x:auto}
/* Reglas nemotécnicas y croquis */
.xsec h2{display:flex;align-items:center;gap:10px}
.xsec h2 .tag{font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--omr);background:var(--omr-soft);border-radius:6px;padding:3px 7px}
.nemo{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.nm{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg);min-width:0}
.nm b{display:block;font:800 19px/1.25 var(--display);color:var(--omr);margin-bottom:4px;overflow-wrap:anywhere}
.nm span{font-size:15px}
.dg-title{font:600 13px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.dg-foot{font-size:14px;color:var(--muted)}
.dg-flow{display:flex;flex-direction:column;align-items:stretch;max-width:560px}
.dg-step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:10px 12px;min-width:0}
.dg-step em{font:600 13px var(--mono);font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.dg-step b{display:block}
.dg-step small{display:block;color:var(--muted);font-size:14px}
.dg-arr{align-self:center;color:var(--accent);font-size:20px;line-height:1;padding:3px 0}
.dg-arr::before{content:"↓"}
@media (min-width:640px){
 .dg-flow.h{flex-direction:row;align-items:center;max-width:none}
 .dg-flow.h .dg-step{flex:1 1 0;grid-template-columns:minmax(0,1fr);text-align:center;justify-items:center;align-self:stretch}
 .dg-flow.h .dg-arr{padding:0 6px}
 .dg-flow.h .dg-arr::before{content:"→"}
}
.dg-cyc{width:100%;max-width:440px;height:auto;display:block;margin:0 auto}
.dg-cyc rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.dg-cyc text{fill:var(--ink);font-family:var(--body);font-size:14px;font-weight:700}
.dg-cyc text.c{fill:var(--muted);font-weight:700;font-size:14px}
.dg-cyc text.cb{fill:var(--omr);font-family:var(--display);font-weight:800;font-size:26px}
.dg-cyc path.arc{stroke:var(--accent);fill:none;stroke-width:2}
.dg-cyc .ah{fill:var(--accent)}
.dg-root{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 14px;font-weight:700;text-align:center}
.dg-kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px;padding-top:12px;border-top:2px solid var(--accent)}
.dg-kid{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.dg-kid b{display:block}
.dg-kid small{display:block;color:var(--muted);font-size:14px}
.dg-gk{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.dg-gk div{border-left:3px solid var(--omr);background:var(--surface);padding:6px 10px;border-radius:0 8px 8px 0;font-size:15px}
.dg-gk div small{display:block;color:var(--muted);font-size:13px}
.dg-pyr{display:flex;flex-direction:column;align-items:center;gap:4px}
.dg-lv{border-radius:8px;padding:8px 12px;text-align:center;min-width:0;max-width:100%}
.dg-lv b{display:block}
.dg-lv small{display:block;font-size:14px;opacity:.85}
.dg-scale{display:grid;column-gap:3px}
.dg-seg{min-width:0}
.dg-seg i{display:block;height:16px;border-radius:3px}
.dg-seg b{font-size:14px;display:block;margin-top:6px;overflow-wrap:anywhere;line-height:1.25}
.dg-seg small{display:block;font:500 13px var(--mono);color:var(--muted);overflow-wrap:anywhere}
@media (max-width:559px){
  .dg-scale.many{grid-template-columns:1fr!important;row-gap:6px}
  .dg-scale.many .dg-seg{display:grid;grid-template-columns:14px minmax(0,1fr) auto;align-items:center;column-gap:10px}
  .dg-scale.many .dg-seg i{height:30px}
  .dg-scale.many .dg-seg b{margin:0}
}
.dg-cmp th:nth-child(2){color:var(--accent)}
.dg-cmp th:nth-child(3){color:var(--omr)}
.dg-cmp td:first-child{font-weight:700}
.dg-mx{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:6px}
.dg-mx .h{font:600 13px var(--mono);text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;letter-spacing:.03em}
.dg-mx .c{border-radius:10px;padding:12px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;min-height:64px;overflow-wrap:anywhere}
.dg-tl{border-left:3px solid var(--accent-soft);margin-left:8px}
.dg-ti{position:relative;padding:4px 0 12px 20px}
.dg-ti::before{content:"";position:absolute;left:-10px;top:8px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.dg-ti b{font:600 14px var(--mono);color:var(--accent);display:block}
.dg-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.dg-card{border-top:4px solid var(--accent);background:var(--bg);border-radius:10px;padding:10px 12px;min-width:0}
.dg-card b{display:block;font-family:var(--display);font-size:17px}
.dg-card span{font-size:15px;color:var(--muted)}
.dg-ly{border:2px solid var(--accent);border-radius:16px;padding:8px 10px 10px}
.dg-ly>span{display:block;font-size:14px;font-weight:700;margin-bottom:6px;text-align:center}
.dg-ly.core{background:var(--accent);color:var(--accent-ink);padding:12px}
.dg-ly.core>span{margin:0}
.dg-bars{display:flex;flex-direction:column;gap:8px}
.dg-bar{display:grid;grid-template-columns:minmax(90px,38%) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:15px}
.dg-bar .tr{height:16px;background:var(--sunk);border-radius:4px;overflow:hidden}
.dg-bar .tr i{display:block;height:100%;background:var(--omr)}
.dg-bar .v{font:600 14px var(--mono);font-variant-numeric:tabular-nums}
.dg-sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.dg-s{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.dg-s i{width:28px;height:28px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.dg-s b{display:block}
.dg-s small{display:block;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script src="temario.js"></script>
<script src="fichas-g.js"></script>
<script src="fichas-e1.js"></script>
<script src="fichas-e2.js"></script>
<script src="extras-1.js"></script>
<script src="extras-2.js"></script>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#hoy"><span class="dot">E</span>Cuaderno OPE Enfermería</a>
    <span class="chip count" id="countdown">—</span>
    <span class="chip sync" id="sync" data-s="local">Guardado en este dispositivo</span>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs">
    <a href="#hoy" data-r="hoy">Hoy</a>
    <a href="#temario" data-r="temario">Temario</a>
    <a href="#plan" data-r="plan">Plan 13 semanas</a>
    <a href="#examen" data-r="examen">El examen</a>
    <a href="#" id="testLink" hidden>Hacer test</a>
  </nav></div>
</header>
<main class="wrap" id="view"></main>

<script>
(function(){
"use strict";
var TEST_URL = "test.html";
var T=window.TEMARIO,TM={},F=window.FICHAS,PLAN=window.PLAN,EX=window.EXAM;
T.forEach(function(t,i){t.i=i;TM[t.c]=t});
var view=document.getElementById("view");

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}

/* ---------- almacenamiento: local + base de datos del artefacto ---------- */
var Sync=(function(){
  var db=null,ref=null,data=null,writing=false,dirty=false,timer=null,ro=false,onChange=function(){};
  var KEY="ope-estudio-estado",PATH="progreso/estudio";
  function status(s){var el=document.getElementById("sync");el.dataset.s=s;el.textContent=s==="sync"?"Sincronizado":s==="offline"?"Sin conexión, guardando aquí":"Guardado en este dispositivo"}
  function saveLocal(){lsSet(KEY,data)}
  function init(def,cb){
    onChange=cb;data=lsGet(KEY,null)||def;onChange(false);
    var c=window.claude;if(!c||!c.use)return;
    c.use("db").then(function(d){
      db=d;if(!db)return;try{ref=db.doc(PATH)}catch(e){return}
      var t=setTimeout(function(){status("offline")},10000);
      ref.onSnapshot(function(snap){
        if(!snap.metadata.fromCache)clearTimeout(t);
        if(snap.metadata.hasPendingWrites)return;
        if(snap.exists){var r=snap.data();
          if((r.upd||0)>(data.upd||0)){data=JSON.parse(JSON.stringify(r));saveLocal();onChange(true)}
          else if((data.upd||0)>(r.upd||0))push();
        }else if(data.upd)push();
        if(!snap.metadata.fromCache&&!ro)status("sync");
      },function(){clearTimeout(t);status("local")});
    }).catch(function(){});
  }
  function touch(){data.upd=Date.now();saveLocal();clearTimeout(timer);timer=setTimeout(push,1500)}
  function push(){if(!ref||ro)return;if(writing){dirty=true;return}writing=true;
    ref.set(JSON.parse(JSON.stringify(data))).then(function(){status("sync")},function(e){
      if(e&&e.code==="unavailable")setTimeout(push,1500+Math.random()*2000);else{ro=(e&&e.code==="invalid_argument");status("local")}
    }).then(function(){writing=false;if(dirty){dirty=false;push()}})}
  return {init:init,touch:touch,get:function(){return data}};
})();
function D(){return Sync.get()}
function ts(c){return D().t[c]||{st:0}}
function setTs(c,o){D().t[c]=Object.assign({},ts(c),o);Sync.touch()}
function nextDue(c){var s=ts(c);if(!s.st||s.st>=3||!s.r1)return null;var k=(s.rv||[]).length;if(k>=INT.length)return null;return new Date(s.r1+INT[k]*DAY)}
function dueToday(){var t=today0().getTime()+DAY-1;return T.filter(function(x){var d=nextDue(x.c);return d&&d.getTime()<=t})}

/* ---------- mini-markdown de las fichas ---------- */
function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+?)\*/g,"<em>$1</em>")}
function md(src){
  var out="",list=null,tbl=null;
  function closeList(){if(list){out+="</"+list+">";list=null}}
  function closeTbl(){if(tbl){out+='<div class="tbl"><table><thead><tr>'+tbl[0].map(function(c){return"<th>"+inl(c)+"</th>"}).join("")+"</tr></thead><tbody>"+tbl.slice(1).map(function(r){return"<tr>"+r.map(function(c){return"<td>"+inl(c)+"</td>"}).join("")+"</tr>"}).join("")+"</tbody></table></div>";tbl=null}}
  src.split("\n").forEach(function(raw){var l=raw.replace(/\s+$/,"");
    if(l.charAt(0)==="|"){closeList();(tbl=tbl||[]).push(l.split("|").slice(1,-1).map(function(c){return c.trim()}));return}
    closeTbl();
    if(l.indexOf("## ")===0){closeList();out+="<h3>"+inl(l.slice(3))+"</h3>";return}
    if(l.indexOf("- ")===0){if(list!=="ul"){closeList();out+="<ul>";list="ul"}out+="<li>"+inl(l.slice(2))+"</li>";return}
    if(/^\d+\. /.test(l)){if(list!=="ol"){closeList();out+="<ol>";list="ol"}out+="<li>"+inl(l.replace(/^\d+\. /,""))+"</li>";return}
    if(l.indexOf("! ")===0){closeList();out+='<p class="trap"><span>Trampa típica</span>'+inl(l.slice(2))+"</p>";return}
    closeList();if(l.trim())out+="<p>"+inl(l)+"</p>";
  });
  closeList();closeTbl();return out;
}

function lbl(it){return Array.isArray(it)?it:[it]}
function wrapL(s,max){var w=s.split(" "),lines=[],cur="";w.forEach(function(x){if((cur+" "+x).trim().length>max&&cur){lines.push(cur);cur=x}else cur=(cur+" "+x).trim()});if(cur)lines.push(cur);return lines}
function dgFlow(d){var st=d.steps.map(lbl),h=st.length<=4&&st.every(function(x){return x[0].length<=26});
  return '<div class="dg-flow'+(h?" h":"")+'">'+st.map(function(x,i){return (i?'<span class="dg-arr" aria-hidden="true"></span>':"")+'<div class="dg-step"><em>'+(i+1)+'</em><span><b>'+esc(x[0])+"</b>"+(x[1]?"<small>"+esc(x[1])+"</small>":"")+"</span></div>"}).join("")+"</div>"}
function dgCycle(d,id){var n=d.steps.length,W=440,cx=220,cy=220,R=152,bw=132,bh=52,del=(bw/2+10)/R,out="";
  var ang=function(i){return -Math.PI/2+i*2*Math.PI/n};
  for(var i=0;i<n;i++){var a1=ang(i)+del,a2=ang(i+1)-del;if(a2<=a1)continue;
    out+='<path class="arc" d="M'+(cx+R*Math.cos(a1)).toFixed(1)+","+(cy+R*Math.sin(a1)).toFixed(1)+" A"+R+","+R+" 0 0 1 "+(cx+R*Math.cos(a2)).toFixed(1)+","+(cy+R*Math.sin(a2)).toFixed(1)+'" marker-end="url(#'+id+')"/>'}
  d.steps.forEach(function(s,i){var x=cx+R*Math.cos(ang(i)),y=cy+R*Math.sin(ang(i)),ls=wrapL(s,15);
    out+='<rect x="'+(x-bw/2).toFixed(1)+'" y="'+(y-bh/2).toFixed(1)+'" width="'+bw+'" height="'+bh+'" rx="12"/>';
    ls.forEach(function(l,k){out+='<text x="'+x.toFixed(1)+'" y="'+(y+5+(k-(ls.length-1)/2)*17).toFixed(1)+'" text-anchor="middle">'+esc(l)+"</text>"})});
  var cl=wrapL(d.center||"",16),big=cl.length===1&&cl[0].length<=6;
  cl.forEach(function(l,k){out+='<text class="'+(big?"cb":"c")+'" x="'+cx+'" y="'+(cy+(big?9:5)+(k-(cl.length-1)/2)*18)+'" text-anchor="middle">'+esc(l)+"</text>"});
  return '<svg class="dg-cyc" viewBox="0 0 '+W+" "+W+'" role="img" aria-label="'+esc(d.title+": "+d.steps.join(", "))+'"><defs><marker id="'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>'+out+"</svg>"}
function dgTree(d){return '<div class="dg-root">'+esc(d.root)+'</div><div class="dg-kids">'+d.children.map(function(k){return '<div class="dg-kid"><b>'+esc(k.l)+"</b>"+(k.s?"<small>"+esc(k.s)+"</small>":"")+(k.c?'<div class="dg-gk">'+k.c.map(function(g){return "<div>"+esc(g.l)+(g.s?"<small>"+esc(g.s)+"</small>":"")+"</div>"}).join("")+"</div>":"")+"</div>"}).join("")+"</div>"}
function dgPyr(d){var n=d.levels.length,mn=n<=2?55:34;

   extrasHtml(c)+
   '<div class="card stack" style="gap:8px"><label for="notes"><h3>Mis notas</h3></label><textarea class="notes" id="notes" placeholder="Reglas mnemotécnicas, dudas, lo que más te cuesta…">'+esc(s.n||"")+'</textarea><span class="muted small" id="saved"></span></div>'+
   '<nav class="pager">'+(prev?'<a href="#t-'+prev.c+'"><span class="muted small">← Anterior</span><br><b>'+prev.c+"</b> "+esc(prev.s)+"</a>":"<span></span>")+(next?'<a class="r" href="#t-'+next.c+'"><span class="muted small">Siguiente →</span><br><b>'+next.c+"</b> "+esc(next.s)+"</a>":"<span></span>")+"</nav></article>";
  view.querySelector('[aria-label="Estado del tema"]').onclick=function(e){var b=e.target.closest("button");if(!b)return;var v=+b.dataset.st,cur=ts(c),o={st:v};
    if(v>=1&&!cur.r1)o.r1=Date.now();
    if(v===2){o.rv=(cur.rv||[]).concat([Date.now()]).slice(-6)}
    if(v===0){o.r1=null;o.rv=[]}
    setTs(c,o);renderFicha(c)};
  view.querySelector('[aria-label="Tamaño de letra"]').onclick=function(e){var b=e.target.closest("button");if(!b)return;fsz=Math.max(15,Math.min(24,fsz+(+b.dataset.fz)));lsSet("ope-fs",fsz);view.querySelector(".doc").style.setProperty("--fs",fsz+"px")};
  document.getElementById("notes").oninput=function(e){var v=e.target.value;clearTimeout(noteT);noteT=setTimeout(function(){setTs(c,{n:v});var sv=document.getElementById("saved");if(sv)sv.textContent="Guardado"},700)};
}

/* ---------- PLAN ---------- */
function renderPlan(){
  var cur=weekNow().w.w;
  var rows=PLAN.map(function(w){var ts2=T.filter(function(t){return t.w===w.w});
    var chips=ts2.map(function(t){return '<a href="#t-'+t.c+'" class="s'+(ts(t.c).st||0)+'" title="'+esc(t.s)+'">'+t.c+"</a>"}).join("");
    return '<div class="week'+(w.w===cur&&!weekNow().pre?" now":"")+'"><div class="n">SEM<b>'+w.w+"</b></div><div><b>"+fd(parseD(w.ini))+" – "+fd(parseD(w.fin))+'</b><div class="muted small">'+esc(w.foco)+'</div><div class="chips">'+(chips||'<span class="muted small">Simulacros completos (sábado y miércoles), falladas y relectura de trampas.</span>')+"</div></div></div>"}).join("");
  view.innerHTML='<div class="stack"><div><h1>Plan de 13 semanas</h1><p class="muted">Primero los 26 temas de prioridad A (semanas 1–5), después los B (6–11) y al final una pasada rápida por los C, que en su mayoría se solapan con la parte general. Cada tema leído se repasa a los 3, 10 y 24 días.</p></div>'+
   '<div class="legend"><span style="--c:var(--line)">Pendiente</span><span style="--c:var(--warn)">Leído</span><span style="--c:var(--accent)">Repasado</span><span style="--c:var(--ok)">Dominado</span></div>'+
   '<div class="list">'+rows+"</div>"+
   '<div class="card stack" style="gap:6px"><h3>Rutina diaria orientativa</h3><ul style="margin:0;padding-left:1.2em"><li>Lectura activa de 1 tema (ficha + tus apuntes) y notas propias.</li><li>Test del tema recién leído en modo «corregir al momento».</li><li>30–40 preguntas mezcladas y repaso de las falladas.</li><li>Domingos: mini simulacro de 50; desde la semana 10, simulacro completo de 125 en 140 minutos.</li></ul></div></div>';
}

/* ---------- EL EXAMEN ---------- */
function renderExamen(){
  var top=T.filter(function(t){return t.k>=3}).sort(function(a,b){return b.k-a.k||a.i-b.i});
  var gen=T.filter(function(t){return t.c[0]==="G"}).reduce(function(s,t){return s+t.k},0);
  var bars=top.map(function(t){return '<div class="hb"><a class="t" href="#t-'+t.c+'"><span class="code">'+t.c+"</span> "+esc(t.s)+'</a><div class="b"><i style="width:'+(t.k/6*100)+'%"></i></div><span class="v">'+t.k+"</span></div>"}).join("");
  view.innerHTML='<div class="stack"><div><h1>Cómo es el examen</h1><p class="muted">Diplomado Sanitario no Especialista, opción Enfermería. Convocatoria de 4 de diciembre de 2025 (BORM n.º 289), 466 plazas: 377 de acceso libre y 89 de promoción interna.</p></div>'+
   '<div class="facts"><div class="fact"><div class="k">Fecha</div><div class="v">31/01/27</div></div><div class="fact"><div class="k">Preguntas</div><div class="v">125</div></div><div class="fact"><div class="k">Tiempo</div><div class="v">140 min</div></div><div class="fact"><div class="k">Cada error</div><div class="v">−0,25</div></div></div>'+
   '<div class="card stack" style="gap:8px"><h2>Cómo se puntúa</h2><ul style="margin:0;padding-left:1.2em"><li>4 opciones, una válida. Acierto suma, en blanco 0, error resta un cuarto de acierto.</li><li>Aprueba quien alcance el <b>50% de la media de las 10 mejores notas</b>. En 2023 el corte fue de unos <b>23,9 sobre 60</b> (≈ 50 netas de 125).</li><li>Concurso-oposición: la oposición vale el <b>60%</b> y los méritos el <b>40%</b> (turno libre). Los servicios prestados en el SMS se valoran de oficio.</li></ul></div>'+
   '<div class="card stack" style="gap:8px"><h2>¿Contestar o dejar en blanco?</h2><p style="margin:0">Con 4 opciones y −0,25 por error, arriesgar tiene valor esperado positivo incluso sin descartar nada. Cuantas más opciones descartes, más compensa contestar.</p><div class="scroll"><table class="ev"><thead><tr><th>Opciones descartadas</th><th>Probabilidad de acierto</th><th>Valor esperado</th></tr></thead><tbody><tr><td>Ninguna</td><td class="num">25%</td><td class="num">+0,06</td></tr><tr><td>Una</td><td class="num">33%</td><td class="num">+0,17</td></tr><tr><td>Dos</td><td class="num">50%</td><td class="num">+0,38</td></tr></tbody></table></div><p class="muted small" style="margin:0">Deja en blanco solo cuando dudes entre opciones que crees falsas o no tengas ninguna pista. Practica esta decisión en los simulacros.</p></div>'+
   '<div class="card stack" style="gap:10px"><h2>Lo que más cayó en 2023</h2><p class="muted small" style="margin:0">Clasificación propia de las 125 preguntas del examen de 2023 según el temario vigente. Parte general: '+gen+' preguntas; específica: '+(125-gen)+'. El tribunal decide el reparto, y la parte general nueva es más amplia, así que no la descuides.</p><div class="hbars">'+bars+"</div></div>"+
   '<div class="card stack" style="gap:6px"><h2>El día del examen</h2><ul style="margin:0;padding-left:1.2em"><li>DNI, pasaporte o permiso de conducir <b>en soporte físico</b>, y bolígrafo azul o negro.</li><li>Hora, lugar y aulas se publican en murciasalud.es/oposicionsms con al menos 10 días de antelación.</li><li>Las preguntas se basan en la normativa vigente el día del examen.</li><li>Gestantes o con parto reciente pueden pedir hacer el ejercicio en otro lugar o momento (Resolución del SMS de 2 de marzo de 2010).</li></ul></div>'+
   '<div class="card stack" style="gap:6px"><h2>Fuentes oficiales</h2><ul style="margin:0;padding-left:1.2em"><li><a href="https://www.borm.es/services/anuncio/ano/2025/numero/6070/pdf?id=840221" target="_blank" rel="noopener">Convocatoria (BORM n.º 289, 16/12/2025)</a></li><li><a href="https://www.borm.es/services/boletin/ano/2025/numero/280/pdf" target="_blank" rel="noopener">Temario general (BORM n.º 280, 3/12/2025)</a></li><li><a href="https://borm.es/services/anuncio/ano/2022/numero/6606/pdf?id=814049" target="_blank" rel="noopener">Temario específico (BORM n.º 291, 19/12/2022)</a></li><li><a href="https://murcia.satse.es/w/plantillas-examen-ope-enfemeria-murcia" target="_blank" rel="noopener">Examen y plantilla de 2023</a></li></ul></div></div>';
}

Sync.init({v:1,upd:0,t:{}},function(remote){var r=route();if(remote&&r.indexOf("t-")===0&&document.activeElement&&document.activeElement.id==="notes")return;render()});
})();
</script>
