<style>
/* Layout: columna única (máx. 880px) con barra superior fija; modos en rejilla que pasa a 2–3 columnas en iPad; hoja de respuestas tipo lector óptico */
:root{
  --bg:#F2F6F5; --surface:#FFFFFF; --sunk:#E6EDEB; --ink:#122A2B; --muted:#56696A; --line:#D2DDDA;
  --accent:#0B6B66; --accent-ink:#FFFFFF; --accent-soft:#DAECE9;
  --omr:#C2306A; --omr-soft:#F9E2EB;
  --ok:#1C7C45; --ok-soft:#DCF0E3; --bad:#B4372B; --bad-soft:#F8E1DC; --warn:#9A6210; --warn-soft:#F6EAD2;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1516; --surface:#132022; --sunk:#0F1A1B; --ink:#E1EBE9; --muted:#93A7A5; --line:#24383A;
  --accent:#4BBDB2; --accent-ink:#04201D; --accent-soft:#163633;
  --omr:#F06A99; --omr-soft:#3B1A28;
  --ok:#52C483; --ok-soft:#11301F; --bad:#F27766; --bad-soft:#3A1914; --warn:#E6AB4C; --warn-soft:#33260F;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C1516; --surface:#132022; --sunk:#0F1A1B; --ink:#E1EBE9; --muted:#93A7A5; --line:#24383A;
  --accent:#4BBDB2; --accent-ink:#04201D; --accent-soft:#163633;
  --omr:#F06A99; --omr-soft:#3B1A28;
  --ok:#52C483; --ok-soft:#11301F; --bad:#F27766; --bad-soft:#3A1914; --warn:#E6AB4C; --warn-soft:#33260F;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--omr);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none;color:var(--ink)}
.brand .dot{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--omr);display:grid;place-items:center;font:600 11px var(--mono);color:var(--omr)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:14px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.count{background:var(--omr-soft);color:var(--omr);font-weight:700}
.chip.sync[data-s="sync"]{color:var(--ok);background:var(--ok-soft)}
.chip.sync[data-s="offline"]{color:var(--warn);background:var(--warn-soft)}
nav.tabs{display:flex;gap:4px;padding-bottom:8px;overflow-x:auto}
nav.tabs a{padding:8px 14px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:700;font-size:16px;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
main{padding-block:20px 80px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:30px;font-weight:800;letter-spacing:-.015em}
h2{font-size:22px;font-weight:800}

.muted{color:var(--muted)}
.small{font-size:14px}
.mono{font-family:var(--mono)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.hero{display:grid;grid-template-columns:1fr;gap:6px;padding:4px 0 8px}
.hero .big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.02em}
.hero .big span{color:var(--omr)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}

.tile .v{font-family:var(--mono);font-weight:600;font-size:26px;font-variant-numeric:tabular-nums;margin-top:4px}
.tile .v small{font-size:14px;color:var(--muted);font-weight:500}
.modes{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:600px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}

.mode{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-height:118px}
.mode:hover{border-color:var(--accent)}
.mode .t{font-family:var(--display);font-weight:800;font-size:19px}
.mode .d{font-size:15px;color:var(--muted)}

.mode.primary .d,.mode.primary .tag{color:var(--accent-ink);opacity:.9}
.switch{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}

.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li input{width:22px;height:22px;accent-color:var(--accent)}
.code{font:600 13px var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 6px;display:inline-block;min-width:38px;text-align:center}
.prio{font:600 12px var(--mono);border-radius:6px;padding:2px 6px}
.prio.p1{background:var(--omr);color:#fff}.prio.p2{background:var(--omr-soft);color:var(--omr)}.prio.p3{background:var(--sunk);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.lo i{background:var(--bad)}.bar.mid i{background:var(--warn)}.bar.hi i{background:var(--ok)}
.grp{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:10px 14px;background:var(--sunk);font-weight:700}
.stickybar{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* Pregunta */
.qtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.progress i{display:block;height:100%;background:var(--omr);transition:width .25s}
.timer{font:600 18px var(--mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.qtext{font-size:21px;line-height:1.45;font-weight:700;margin:6px 0 4px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:58px;font-size:18px}
.opt .b{width:36px;height:36px;border-radius:50%;border:2px solid var(--omr);display:grid;place-items:center;font:600 15px var(--mono);color:var(--omr);background:var(--surface)}
.opt.sel{border-color:var(--omr);background:var(--omr-soft)}
.opt.sel .b{background:var(--omr);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.opt.ko .b{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default;color:var(--ink)}
.explain{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;padding:12px 14px}
.explain.bad{border-color:var(--bad);background:var(--bad-soft)}
.explain.ok{border-color:var(--ok);background:var(--ok-soft)}
.explain b{display:block;margin-bottom:2px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.qgrid button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:600 14px var(--mono)}
.qgrid button.a{background:var(--omr-soft);border-color:var(--omr);color:var(--omr)}
.qgrid button.f{outline:2px dashed var(--warn);outline-offset:-4px}
.qgrid button.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* Resultados */
.score{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:700px){.score{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.gauge{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;letter-spacing:-.03em}
.gauge small{font-size:22px;color:var(--muted);font-weight:600}
.vs{font-size:15px}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--bad);font-weight:700}
details.rev{border-top:1px solid var(--line);padding:10px 0}
details.rev summary{cursor:pointer;font-weight:700;list-style:none}
details.rev summary::-webkit-details-marker{display:none}
/* Hoja oficial */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 18px}
.srow{display:grid;grid-template-columns:42px repeat(4,40px) 20px;align-items:center;gap:6px;padding:3px 0;border-bottom:1px dashed var(--line)}
.srow .n{font:600 14px var(--mono);color:var(--muted);text-align:right;padding-right:4px}
.srow button{width:36px;height:36px;border-radius:50%;border:2px solid var(--omr);background:transparent;color:var(--omr);font:600 13px var(--mono)}
.srow button.on{background:var(--omr);color:#fff}
.srow button.right{background:var(--ok);border-color:var(--ok);color:#fff}
.srow button.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.srow button.should{border-color:var(--ok);color:var(--ok);border-width:3px}
.srow.anul{opacity:.45}
.srow .m{font:600 13px var(--mono)}
.note{font-size:15px;background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 14px}
.overlay{position:fixed;inset:0;background:rgba(5,15,15,.5);display:grid;place-items:center;z-index:20;padding:16px}
.dialog{background:var(--surface);border-radius:16px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
.spark{width:100%;height:90px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th,table.t td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
table.t td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
"use strict";
var STUDY_URL = "./";
var T = window.TEMARIO, TM = {}, EX = window.EXAM, O = window.OFICIAL2023, PLAN = window.PLAN;
T.forEach(function(t){TM[t.c]=t});
var QBY = {}, QID = {};
QB.forEach(function(q){(QBY[q.t]=QBY[q.t]||[]).push(q);QID[q.id]=q});
var view = document.getElementById("view"), modal = document.getElementById("modal");
var L = "ABCD";

/* ---------- utilidades ---------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pct(x){return Math.round(x*100)}
function fmt1(x){return (Math.round(x*10)/10).toLocaleString("es-ES",{minimumFractionDigits:1,maximumFractionDigits:1})}
function today0(){var d=new Date();d.setHours(0,0,0,0);return d}
function parseD(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function daysLeft(){return Math.round((parseD(EX.fecha)-today0())/86400000)}
function fdate(ts){return new Date(ts).toLocaleDateString("es-ES",{day:"numeric",month:"short"})}
function currentWeek(){var t=today0();for(var i=0;i<PLAN.length;i++){if(t<=parseD(PLAN[i].fin))return PLAN[i]}return PLAN[PLAN.length-1]}
function noShuffle(q){return q.o.some(function(o){return /anteriores|todas son|ninguna es|son correctas/i.test(o)})}

/* ---------- almacenamiento: local + base de datos del artefacto ---------- */
var Sync=(function(){
  var db=null,ref=null,data=null,writing=false,dirty=false,timer=null,ro=false,onChange=function(){};
  var KEY="ope-test-estado", PATH="progreso/test";
  function status(s){var el=document.getElementById("sync");el.dataset.s=s;el.textContent=s==="sync"?"Sincronizado":s==="offline"?"Sin conexión, guardando aquí":"Guardado en este dispositivo"}
  function saveLocal(){lsSet(KEY,data)}
  function init(def,cb){
    onChange=cb;data=lsGet(KEY,null)||def;onChange();
    var c=window.claude;
    if(!c||!c.use){return}
    c.use("db").then(function(d){
      db=d;if(!db)return;
      try{ref=db.doc(PATH)}catch(e){return}
      var t=setTimeout(function(){status("offline")},10000);
      ref.onSnapshot(function(snap){
        if(!snap.metadata.fromCache)clearTimeout(t);
        if(snap.metadata.hasPendingWrites)return;
        if(snap.exists){var r=snap.data();
          if((r.upd||0)>(data.upd||0)){data=JSON.parse(JSON.stringify(r));saveLocal();onChange()}
          else if((data.upd||0)>(r.upd||0)){push()}
        }else if(data.upd){push()}
        if(!snap.metadata.fromCache&&!ro)status("sync");
      },function(){clearTimeout(t);status("local")});
    }).catch(function(){});
  }
  function touch(){data.upd=Date.now();saveLocal();clearTimeout(timer);timer=setTimeout(push,1500)}
  function push(){
    if(!ref||ro)return;
    if(writing){dirty=true;return}
    writing=true;
    ref.set(JSON.parse(JSON.stringify(data))).then(function(){status("sync")},function(e){
      if(e&&e.code==="unavailable"){setTimeout(push,1500+Math.random()*2000)}
      else{ro=(e&&e.code==="invalid_argument");status("local")}
    }).then(function(){writing=false;if(dirty){dirty=false;push()}});
  }
  return {init:init,touch:touch,get:function(){return data}};
})();
function D(){return Sync.get()}
var DEF=function(){return {v:1,upd:0,q:{},h:[],of:{a:"",d:0,c:false}}};

/* ---------- estadísticas ---------- */
function qs(id){return D().q[id]}
function topicStat(c){
  var list=QBY[c]||[],seen=0,n=0,ok=0;
  list.forEach(function(q){var s=qs(q.id);if(s&&s[0]){seen++;n+=s[0];ok+=s[1]}});
  return {total:list.length,seen:seen,n:n,ok:ok,acc:n?ok/n:null};
}
function globalStat(){var seen=0,n=0,ok=0,fail=0;
  Object.keys(D().q).forEach(function(id){if(!QID[id])return;var s=D().q[id];if(s[0]){seen++;n+=s[0];ok+=s[1];if(s[2]!==1)fail++}});
  return {seen:seen,n:n,ok:ok,acc:n?ok/n:null,fail:fail};
}
function record(id,res){ // res: 1 acierto, 0 fallo, 2 blanco
  var s=D().q[id]||[0,0,0,0];s[0]++;if(res===1)s[1]++;s[2]=res;s[3]=Date.now();D().q[id]=s;
}
function lastSim(){var h=D().h;for(var i=h.length-1;i>=0;i--){if(h[i].m==="simulacro"||h[i].m==="oficial")return h[i]}return null}

/* ---------- selección de preguntas ---------- */
function weightedSample(pool,n){
  var cnt={};pool.forEach(function(q){cnt[q.t]=(cnt[q.t]||0)+1});
  return pool.map(function(q){var w=((TM[q.t].k||0)+1)/cnt[q.t];return {q:q,k:Math.pow(Math.random(),1/w)}})
    .sort(function(a,b){return b.k-a.k}).slice(0,n).map(function(x){return x.q});
}
function weakTopics(){return T.filter(function(t){var s=topicStat(t.c);return s.n>=4&&s.acc<0.6}).map(function(t){return t.c})}
function buildSession(mode,opts){
  var pool=[],inm=lsGet("ope-inmediata",true),limit=0,title="";
  if(mode==="tema"){pool=[];opts.temas.forEach(function(c){pool=pool.concat(QBY[c]||[])});pool=shuffle(pool.slice());if(opts.n)pool=pool.slice(0,opts.n);title=opts.temas.length===1?TM[opts.temas[0]].s:opts.temas.length+" temas"}
  else if(mode==="aleatorio"){
    var src=QB.filter(function(q){var t=TM[q.t];
      if(opts.f==="a")return t.p===1; if(opts.f==="g")return q.t[0]==="G"; if(opts.f==="e")return q.t[0]==="E";
      if(opts.f==="w"){var w=weakTopics();return w.indexOf(q.t)>=0||!qs(q.id)} return true});
    pool=weightedSample(src,opts.n);title="Aleatorio";
  }
  else if(mode==="simulacro"){var n=Math.min(opts.n,QB.length);pool=weightedSample(QB,n);inm=false;limit=Math.round(EX.minutos*n/EX.preguntas);title=n===125?"Simulacro completo":"Mini simulacro"}
  else if(mode==="fallos"){pool=QB.filter(function(q){var s=qs(q.id);return s&&s[2]!==1}).sort(function(a,b){return qs(b.id)[3]-qs(a.id)[3]}).slice(0,opts.n||30);title="Repaso de falladas"}
  if(!pool.length)return null;
  return {mode:mode,title:title,inm:inm,limit:limit,start:Date.now(),i:0,done:false,
    items:pool.map(function(q){var ord=[0,1,2,3];if(!noShuffle(q))shuffle(ord);return {id:q.id,ord:ord,ans:null,flag:false}})};
}

    :'<button class="btn" data-act="prev" '+(S.i?"":"disabled")+'>Anterior</button><button class="btn ghost" data-act="flag">'+(it.flag?"Quitar duda":"Marcar duda")+'</button><button class="btn ghost" data-act="sheet">Hoja</button>'+(last?'<button class="btn omr" data-act="finish">Entregar</button>':'<button class="btn pri" data-act="next">Siguiente</button>');
  view.innerHTML='<div class="stack" style="gap:14px"><div class="qtop"><button class="btn ghost" data-act="exit">Salir</button><span class="mono muted">'+(S.i+1)+" / "+n+'</span><span class="code">'+q.t+'</span><span class="muted small" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.s)+"</span>"+(S.limit?'<span class="timer" id="timer"></span>':"")+(S.inm?"":'<button class="btn omr" data-act="finish">Entregar</button>')+'</div>'+

function updTimer(){var el=document.getElementById("timer");if(!el||!S)return;var rem=S.limit*60000-(Date.now()-S.start);if(rem<=0){clearInterval(tick);toast("Tiempo agotado: se entrega el simulacro.");return finish()}
  var m=Math.floor(rem/60000),s=Math.floor(rem%60000/1000);el.textContent=m+":"+(s<10?"0":"")+s;el.className="timer"+(rem<600000?" low":"")}
function answer(oi){var it=S.items[S.i];if(S.inm){if(it.ans!==null)return;it.ans=oi;var q=QID[it.id];record(it.id,oi===-1?2:oi===q.a?1:0);Sync.touch()}else{it.ans=(it.ans===oi?null:oi)}saveS();renderQuiz()}
function next(){if(S.i<S.items.length-1){S.i++;saveS();renderQuiz();window.scrollTo(0,0)}else finish()}

  var ok=0,ko=0,bl=0,per={};
  S.items.forEach(function(it){var q=QID[it.id];if(!q)return;var res=(it.ans===null||it.ans===-1)?2:(it.ans===q.a?1:0);

    var p=per[q.t]=per[q.t]||{ok:0,ko:0,bl:0};p[["ko","ok","bl"][res]]++;
    if(!S.inm)record(it.id,res)});
  var n=ok+ko+bl,net=ok-ko*EX.penal,nota=n?Math.max(0,net)/n*60:0;

function spark(h){
  var W=600,H=120,p=26,n=h.length,max=60,ys=function(v){return H-p-(v/max)*(H-2*p)},xs=function(i){return n===1?W/2:p+i*(W-2*p)/(n-1)};

    rows+='<div class="srow'+(isA?" anul":"")+'"><span class="n">'+n1+"</span>"+L.split("").map(function(l){var cls="";if(corr&&!isA){if(m===l&&l===k)cls="right";else if(m===l)cls="wrong";else if(l===k)cls="should"}else if(m===l)cls="on";
      return '<button data-act="bub" data-i="'+i+'" data-l="'+l+'" class="'+cls+'" aria-label="Pregunta '+n1+" opción "+l+'" '+(corr?"disabled":"")+">"+l+"</button>"}).join("")+'<span class="m">'+(isA?"✕":"")+"</span></div>"}
  var missList=res?Object.keys(res.miss).sort(function(x,y){return res.miss[y]-res.miss[x]}).map(function(c){return '<li><span class="code">'+c+"</span> "+esc(TM[c].s)+' — <b>'+res.miss[c]+"</b> fallo"+(res.miss[c]>1?"s":"")+' · <a href="#tema-'+c+'">practicar</a></li>'}).join(""):"";
  var marked=a.replace(/-/g,"").length;
  view.innerHTML='<div class="stack"><div><h1>Examen real SMS 2023</h1><p class="muted">Oposición de Enfermería del 12 de noviembre de 2023 (885 plazas). Abre el cuadernillo oficial (Modelo A) en otra pestaña o en Split View, marca aquí tus respuestas como en la hoja del examen y corrige con la plantilla oficial.</p></div>'+
   '<div class="row"><a class="btn pri" href="'+O.pdf+'" target="_blank" rel="noopener">Abrir cuadernillo oficial ↗</a><a class="btn ghost" href="'+O.pdfAlt+'" target="_blank" rel="noopener">Copia alternativa ↗</a>'+(corr?"":'<button class="btn" data-act="ofTimer">'+(of.t0?"Cronómetro en marcha":"Iniciar 140 min")+"</button>")+'<span class="timer" id="ofclock"></span></div>'+
   '<p class="note">Las preguntas 8, 63, 84, 91 y 121 fueron anuladas en la plantilla definitiva y no puntúan: la nota se calcula sobre 120. Penalización: cada error resta 0,25.</p>'+
   (res?'<div class="card stack" style="gap:6px"><div class="muted small">Tu nota en el examen real</div><div class="gauge">'+fmt1(res.nota)+'<small>/60</small></div><div class="vs">'+res.ok+" aciertos, "+res.ko+" fallos, "+res.bl+" en blanco · netas "+fmt1(res.net)+'. Corte de 2023: <b class="mono">23,9</b> → <span class="'+(res.nota>=EX.corte2023?"pass":"fail")+'">'+(res.nota>=EX.corte2023?"aprobado":"por debajo")+"</span>.</div>"+(missList?'<h3 style="margin-top:8px">Dónde fallaste</h3><ul>'+missList+"</ul>":"")+'<div><button class="btn" data-act="ofReset">Borrar y repetir</button></div></div>':"")+
   '<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3>Hoja de respuestas</h3><span class="mono muted small">'+marked+"/125 marcadas</span></div>"+(corr?'<p class="small muted">Verde: acierto · rojo: fallo · círculo verde: la respuesta correcta.</p>':"")+'<div class="sheet">'+rows+"</div></div>"+
   (corr?"":'<div class="stickybar"><button class="btn omr" data-act="ofCorr">Corregir examen</button><span class="muted small">Puedes dejar preguntas en blanco.</span></div>')+"</div>";
  clearInterval(ofTimer);
  if(of.t0&&!corr){var upd=function(){var el=document.getElementById("ofclock");if(!el){clearInterval(ofTimer);return}var rem=140*60000-(Date.now()-of.t0);if(rem<0)rem=0;var m=Math.floor(rem/60000),s=Math.floor(rem%60000/1000);el.textContent=m+":"+(s<10?"0":"")+s;el.className="timer"+(rem<600000?" low":"")};upd();ofTimer=setInterval(upd,1000)}
}

/* ---------- eventos ---------- */
document.addEventListener("click",function(ev){
  if(ev.target.classList&&ev.target.classList.contains("overlay")){modal.innerHTML="";return}
  var b=ev.target.closest("[data-act]");if(!b)return;var a=b.dataset.act;
  if(a==="mode"){var m=b.dataset.m;
    if(m==="sim-125")return askConfirm("¿Empezar el simulacro completo?","125 preguntas y 140 minutos. Se corrige al final con −0,25 por error.","Empezar",function(){start(buildSession("simulacro",{n:125}))});
    if(m==="sim-50")return start(buildSession("simulacro",{n:50}));
    if(m==="fallos")return start(buildSession("fallos",{n:30}));
    return go(m)}
  if(a==="resume")return go("quiz");
  if(a==="discard"){clearS();return renderHome()}
  if(a==="selq"){var q=b.dataset.q;if(q==="none")cfgSel=[];if(q==="a")cfgSel=T.filter(function(t){return t.p===1}).map(function(t){return t.c});if(q==="week"){var w=currentWeek().w;cfgSel=T.filter(function(t){return t.w===w}).map(function(t){return t.c})}if(q==="weak")cfgSel=weakTopics();return renderConfigTema([])}
  if(a==="setn"){cfgN=+b.dataset.n;[].forEach.call(document.querySelectorAll("#nsel button"),function(x){x.setAttribute("aria-pressed",x===b)});return updStart()}
  if(a==="startTema")return start(buildSession("tema",{temas:cfgSel,n:cfgN}));
  if(a==="rnN"){rnN=+b.dataset.n;return renderConfigAleatorio()}
  if(a==="rnF"){rnF=b.dataset.f;return renderConfigAleatorio()}
  if(a==="startRandom")return start(buildSession("aleatorio",{n:rnN,f:rnF}));
  if(a==="ans")return answer(+b.dataset.o);
  if(a==="blank")return answer(-1);
  if(a==="next")return next();
  if(a==="prev"){if(S.i>0){S.i--;saveS();renderQuiz()}return}
  if(a==="flag"){S.items[S.i].flag=!S.items[S.i].flag;saveS();return renderQuiz()}
  if(a==="sheet")return showSheet();
  if(a==="jump"){S.i=+b.dataset.i;saveS();modal.innerHTML="";return renderQuiz()}
  if(a==="finish"){var pend=S.items.filter(function(it){return it.ans===null}).length;
    if(S.inm)return finish();
    return askConfirm("¿Entregar?",pend?"Te quedan "+pend+" preguntas sin contestar (cuentan como en blanco).":"Has contestado todas.","Entregar",finish)}
  if(a==="exit")return askConfirm("¿Salir del test?","Podrás continuarlo desde el inicio.","Salir",function(){go("inicio")});
  if(a==="again"){var m2=S.mode,old=S;clearS();if(m2==="simulacro")return start(buildSession("simulacro",{n:old.items.length}));if(m2==="tema")return start(buildSession("tema",{temas:cfgSel.length?cfgSel:uniqTopics(old),n:old.items.length}));if(m2==="aleatorio")return start(buildSession("aleatorio",{n:old.items.length,f:rnF}));return start(buildSession("fallos",{n:30}))}
  if(a==="retryWrong"){var ids=S.items.filter(function(it){var q=QID[it.id];return q&&it.ans!==q.a}).map(function(it){return it.id});clearS();
    return start({mode:"fallos",title:"Repetir falladas",inm:lsGet("ope-inmediata",true),limit:0,start:Date.now(),i:0,done:false,items:ids.map(function(id){var q=QID[id],ord=[0,1,2,3];if(!noShuffle(q))shuffle(ord);return {id:id,ord:ord,ans:null,flag:false}})})}
  if(a==="home"){clearS();return go("inicio")}
  if(a==="bub"){var of=D().of,s=(of.a||"").padEnd(125,"-").split(""),i=+b.dataset.i,l=b.dataset.l;s[i]=s[i]===l?"-":l;of.a=s.join("");of.d=Date.now();Sync.touch();
    var row=b.parentNode;[].forEach.call(row.querySelectorAll("button"),function(x){x.className=(s[i]===x.dataset.l)?"on":""});
    var cnt=view.querySelector(".card .mono.muted.small");if(cnt)cnt.textContent=of.a.replace(/-/g,"").length+"/125 marcadas";return}
  if(a==="ofTimer"){if(!D().of.t0){D().of.t0=Date.now();Sync.touch()}return renderOficial()}
  if(a==="ofCorr")return askConfirm("¿Corregir el examen?","Se compara tu hoja con la plantilla oficial.","Corregir",function(){var of=D().of;of.c=true;
      var aa=(of.a||"").padEnd(125,"-"),ok=0,ko=0,bl=0;for(var i=0;i<125;i++){if(O.anuladas.indexOf(i+1)>=0)continue;if(aa[i]==="-")bl++;else if(aa[i]===O.clave[i])ok++;else ko++}
      var n=125-O.anuladas.length;D().h.push({d:Date.now(),m:"oficial",n:n,ok:ok,ko:ko,bl:bl,nota:Math.round(Math.max(0,ok-ko*EX.penal)/n*600)/10});Sync.touch();renderOficial();window.scrollTo(0,0)});
  if(a==="ofReset")return askConfirm("¿Borrar tu hoja?","Se borran las marcas para volver a hacerlo. Tu nota queda guardada en el historial.","Borrar",function(){D().of={a:"",d:0,c:false};Sync.touch();renderOficial()});
  if(a==="closeModal"){modal.innerHTML="";return}
});
function uniqTopics(s){var u=[];s.items.forEach(function(it){var t=it.id.split(".")[0];if(u.indexOf(t)<0)u.push(t)});return u}
function askConfirm(title,body,okTxt,fn){
  modal.innerHTML='<div class="overlay"><div class="dialog" role="dialog" aria-modal="true"><h2>'+esc(title)+'</h2><p class="muted" style="margin:0">'+esc(body)+'</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="closeModal">Cancelar</button><button class="btn pri" id="okBtn">'+esc(okTxt)+"</button></div></div></div>";
  document.getElementById("okBtn").onclick=function(){modal.innerHTML="";fn()};
}
function showSheet(){
  var cells=S.items.map(function(it,i){return '<button data-act="jump" data-i="'+i+'" class="'+(i===S.i?"cur":it.ans!==null?"a":"")+(it.flag?" f":"")+'">'+(i+1)+"</button>"}).join("");
  modal.innerHTML='<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" style="max-width:640px"><h2>Hoja de respuestas</h2><p class="muted small" style="margin:0">Rosa: contestada · borde discontinuo: marcada como duda.</p><div class="qgrid" style="max-height:55vh;overflow:auto">'+cells+'</div><div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeModal">Cerrar</button></div></div></div>';
}
function toast(msg){var d=document.createElement("div");d.className="note";d.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;max-width:90vw";d.textContent=msg;document.body.appendChild(d);setTimeout(function(){d.remove()},3500)}

Sync.init(DEF(),function(){var r=route();if(r==="quiz")return;render()});
})();
</script>
